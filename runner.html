<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no"><title>Coffee Runner</title>
<style>html,body{margin:0;height:100%;background:#000;overflow:hidden;display:flex;align-items:center;justify-content:center;touch-action:none}canvas{display:block;image-rendering:auto}a{position:fixed;left:10px;bottom:8px;color:#555;font:12px monospace;text-decoration:none}a:hover{color:#ff8a1c}</style></head>
<body><canvas id="c" width="960" height="540"></canvas><a href="index.html">‹ all games</a><script>
// ---- shared engine (inlined into each game) ----
const W=960,H=540,OR='#ff8a1c',ORG='rgba(255,138,28,';
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
function resize(){const s=Math.min(innerWidth/W,innerHeight/H);cv.style.width=W*s+'px';cv.style.height=H*s+'px';}
addEventListener('resize',resize);resize();
const keys={},pressed={};
addEventListener('keydown',e=>{if(!keys[e.code])pressed[e.code]=1;keys[e.code]=1;Audio_.start();if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault();});
addEventListener('keyup',e=>{keys[e.code]=0;});
function down(...c){return c.some(k=>keys[k]);}
function hit(...c){return c.some(k=>pressed[k]);}
function endFrame(){for(const k in pressed)delete pressed[k];}
// touch buttons: {x,y,r,label,code}
let BUTTONS=[],touchOn=false,tapAny=null;
function touchMap(e){e.preventDefault();touchOn=true;Audio_.start();const r=cv.getBoundingClientRect(),act={};
 for(const t of e.touches){const x=(t.clientX-r.left)/r.width*W,y=(t.clientY-r.top)/r.height*H;let used=false;
  for(const b of BUTTONS)if(Math.hypot(x-b.x,y-b.y)<b.r*1.25){act[b.code]=1;used=true;}
  if(!used&&tapAny)act[tapAny]=1;}
 const codes=new Set([...BUTTONS.map(b=>b.code),tapAny].filter(Boolean));
 for(const c of codes){if(act[c]&&!keys[c])pressed[c]=1;keys[c]=!!act[c];}}
for(const ev of['touchstart','touchmove','touchend','touchcancel'])cv.addEventListener(ev,touchMap,{passive:false});
cv.addEventListener('mousedown',()=>{Audio_.start();if(tapAny){pressed[tapAny]=1;keys[tapAny]=1;}});
cv.addEventListener('mouseup',()=>{if(tapAny)keys[tapAny]=0;});
function drawButtons(){if(!touchOn)return;ctx.save();ctx.font='bold 16px monospace';ctx.textAlign='center';ctx.textBaseline='middle';
 for(const b of BUTTONS){ctx.globalAlpha=keys[b.code]?.55:.25;ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,7);ctx.stroke();ctx.fillStyle='#fff';ctx.fillText(b.label,b.x,b.y);}ctx.restore();}
// ---- audio: synthesized cavern wind drone ----
const Audio_={ac:null,master:null,muted:false,start(){if(this.ac)return;try{const ac=this.ac=new(window.AudioContext||window.webkitAudioContext)();
 const m=this.master=ac.createGain();m.gain.value=0;m.connect(ac.destination);m.gain.linearRampToValueAtTime(.5,ac.currentTime+3);
 // noise wind
 const len=ac.sampleRate*4,buf=ac.createBuffer(1,len,ac.sampleRate),d=buf.getChannelData(0);let l=0;for(let i=0;i<len;i++){l=(l+.02*(Math.random()*2-1))/1.02;d[i]=l*3.5;}
 const n=ac.createBufferSource();n.buffer=buf;n.loop=true;const bp=ac.createBiquadFilter();bp.type='bandpass';bp.frequency.value=220;bp.Q.value=1.2;
 const lfo=ac.createOscillator();lfo.frequency.value=.07;const lg=ac.createGain();lg.gain.value=120;lfo.connect(lg);lg.connect(bp.frequency);
 const ng=ac.createGain();ng.gain.value=.5;n.connect(bp);bp.connect(ng);ng.connect(m);n.start();lfo.start();
 // resonant low tones
 [[41.2,.12],[61.7,.06],[82.4,.04]].forEach(([f,g])=>{const o=ac.createOscillator();o.type='sine';o.frequency.value=f;const gg=ac.createGain();gg.gain.value=g;
  const l2=ac.createOscillator();l2.frequency.value=.05+Math.random()*.05;const l2g=ac.createGain();l2g.gain.value=g*.6;l2.connect(l2g);l2g.connect(gg.gain);o.connect(gg);gg.connect(m);o.start();l2.start();});
 }catch(e){}},
 toggle(){if(!this.ac)return;this.muted=!this.muted;this.master.gain.setTargetAtTime(this.muted?0:.5,this.ac.currentTime,.2);},
 blip(f=660,t=.12,type='sine',v=.15){if(!this.ac||this.muted)return;const ac=this.ac,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,ac.currentTime);o.frequency.exponentialRampToValueAtTime(f*1.5,ac.currentTime+t);g.gain.setValueAtTime(v,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+t);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+t);}};
// ---- background ----
const LINES=[...Array(14)].map((_,i)=>({x:i*173+Math.random()*90,len:120+Math.random()*320,p:.15+Math.random()*.5}));
function drawBG(camX,t){const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,'#070707');g.addColorStop(.6,'#121212');g.addColorStop(1,'#030303');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 // far cliffs layers
 for(const[p,col,top,edge]of[[.15,'#101010',150,.10],[.35,'#0b0b0b',250,.18]]){const off=camX*p;ctx.fillStyle=col;
  for(let i=-1;i<9;i++){const k=Math.floor(off/180)+i,x=k*180-off,h=top+((k*7919)%5)*22;ctx.fillRect(x,h,181,H);ctx.fillStyle=`rgba(255,255,255,${edge})`;ctx.fillRect(x,h,181,2);ctx.fillStyle=col;}}
 // hanging glowing lines
 ctx.save();ctx.shadowColor='#fff';ctx.shadowBlur=8;for(const l of LINES){let x=((l.x-camX*l.p)%2400+2400)%2400-200;ctx.strokeStyle=`rgba(255,255,255,${.25+l.p*.6})`;ctx.lineWidth=1+l.p;ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x+Math.sin(t*.5+l.x)*3,l.len);ctx.stroke();}ctx.restore();
 // drifting dust
 ctx.fillStyle='rgba(255,255,255,.25)';for(let i=0;i<40;i++){const x=((i*97-camX*.6+t*8*(i%3+1))%W+W)%W,y=(i*53+Math.sin(t*.3+i)*20)%H;ctx.fillRect(x,y,1.5,1.5);}}
function vignette(){const g=ctx.createRadialGradient(W/2,H/2,H*.3,W/2,H/2,H*.9);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.75)');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);}
// black block with glowing white top edge
function drawLedge(x,y,w,h,alpha=1){ctx.save();ctx.globalAlpha=alpha;const g=ctx.createLinearGradient(0,y,0,y+h);g.addColorStop(0,'#1a1a1a');g.addColorStop(.15,'#0a0a0a');g.addColorStop(1,'#000');ctx.fillStyle=g;ctx.fillRect(x,y,w,h);
 ctx.fillStyle='rgba(255,255,255,.07)';for(let i=8;i<w;i+=23)ctx.fillRect(x+i,y+6,1,Math.min(h-6,30+(i*13)%60));
 ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#f4f4f4';ctx.fillRect(x,y,w,3);ctx.shadowBlur=0;ctx.fillStyle='rgba(255,255,255,.25)';ctx.fillRect(x,y+3,w,4);ctx.restore();}
// astronaut: (x,y)=feet center
function drawAstronaut(x,y,t,face=1,run=0,air=false){ctx.save();ctx.translate(x,y);ctx.scale(face,1);
 const ph=t*(6+run*6),sw=run>0.05?Math.sin(ph)*.7*Math.min(1,run+.3):0,bob=run>.05?Math.abs(Math.sin(ph))*2:0;ctx.translate(0,-bob);
 const leg=(a,c)=>{ctx.save();ctx.translate(0,-22);ctx.rotate(a);ctx.fillStyle=c;ctx.fillRect(-3.5,0,7,12);ctx.translate(0,12);ctx.rotate(-Math.abs(a)*.6);ctx.fillRect(-3,0,6,10);ctx.fillStyle='#222';ctx.fillRect(-3,9,9,3);ctx.restore();};
 leg(air?-.5:-sw,'#8a8a8a');ctx.fillStyle='#555';ctx.fillRect(-13,-44,8,18);// backpack
 leg(air?.4:sw,'#cfcfcf');
 ctx.fillStyle='#d8d8d8';ctx.beginPath();ctx.roundRect(-8,-46,16,26,4);ctx.fill();ctx.fillStyle='#9a9a9a';ctx.fillRect(-8,-30,16,3);
 ctx.save();ctx.translate(2,-42);ctx.rotate(air?-1.2:sw*.8);ctx.fillStyle='#bbb';ctx.fillRect(-3,0,6,14);ctx.fillStyle='#777';ctx.fillRect(-3,13,6,4);ctx.restore();
 ctx.fillStyle='#e6e6e6';ctx.beginPath();ctx.arc(1,-52,8,0,7);ctx.fill();ctx.fillStyle='#111';ctx.beginPath();ctx.ellipse(4,-52,5,4.5,0,0,7);ctx.fill();
 ctx.fillStyle=ORG+'.8)';ctx.fillRect(5,-55,2,3);ctx.restore();}
// coffee cup with steam; (x,y)=center
const steam=[];
function drawCoffee(x,y,t,glow=1,scale=1){ctx.save();if(Math.random()<.5)steam.push({x:x+(Math.random()-.5)*6*scale,y:y-8*scale,a:1,vx:(Math.random()-.5)*10,s:scale});
 ctx.translate(x,y);ctx.scale(scale,scale);const gr=ctx.createRadialGradient(0,0,2,0,0,60*glow);gr.addColorStop(0,ORG+(.45*glow)+')');gr.addColorStop(1,ORG+'0)');ctx.fillStyle=gr;ctx.fillRect(-110,-110,220,220);
 ctx.shadowColor=OR;ctx.shadowBlur=18*glow;ctx.fillStyle=OR;ctx.beginPath();ctx.moveTo(-9,-8);ctx.lineTo(9,-8);ctx.lineTo(7,8);ctx.lineTo(-7,8);ctx.closePath();ctx.fill();
 ctx.strokeStyle=OR;ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(10,-1,4.5,-1.4,1.4);ctx.stroke();ctx.shadowBlur=0;ctx.fillStyle='#ffd2a0';ctx.fillRect(-8,-8,16,2.5);ctx.fillStyle='rgba(120,50,0,.6)';ctx.fillRect(-7,-5.5,14,1.5);
 ctx.fillStyle=ORG+'.6)';ctx.fillRect(-12,9,24,1.5);ctx.restore();}
function drawSteam(dt,camX=0){ctx.save();for(let i=steam.length-1;i>=0;i--){const s=steam[i];s.a-=dt*.9;s.y-=dt*28*s.s;s.x+=s.vx*dt+Math.sin(s.y*.08)*.3;if(s.a<=0){steam.splice(i,1);continue;}
 ctx.fillStyle=`rgba(255,${170+s.a*60|0},${120+s.a*80|0},${s.a*.35})`;ctx.beginPath();ctx.arc(s.x-camX,s.y,(2+(1-s.a)*5)*s.s,0,7);ctx.fill();}ctx.restore();}
function txt(s,x,y,size=20,col='#fff',align='center',alpha=1){ctx.save();ctx.globalAlpha=alpha;ctx.font=`${size}px "Courier New",monospace`;ctx.textAlign=align;ctx.fillStyle=col;ctx.fillText(s,x,y);ctx.restore();}
function title(name,sub,lines,t){ctx.fillStyle='rgba(0,0,0,.55)';ctx.fillRect(0,0,W,H);txt(name,W/2,180,54,'#fff');ctx.save();ctx.shadowColor=OR;ctx.shadowBlur=12;txt(sub,W/2,222,18,OR);ctx.restore();
 lines.forEach((l,i)=>txt(l,W/2,290+i*28,16,'#bbb'));txt(touchOn?'TAP TO START':'PRESS SPACE / ENTER',W/2,470,20,'#fff','center',.5+.5*Math.sin(t*3));}
// tiny loop helper
function loop(fn){let last=performance.now();function f(n){const dt=Math.min(.033,(n-last)/1000);last=n;fn(dt,n/1000);if(hit('KeyM'))Audio_.toggle();endFrame();requestAnimationFrame(f);}requestAnimationFrame(f);}

tapAny='Space';
let state='title',ledges,beans,p,camX,speed,dist,score,best=+localStorage.getItem('acRunnerBest')||0,coyote,buffer,cup,shake=0,deadT=0;
function reset(){ledges=[{x:-200,y:380,w:900}];beans=[];camX=0;speed=260;dist=0;score=0;coyote=0;buffer=0;
 p={x:200,y:380,vy:0,ground:true};cup={x:150,y:320};while(ledges.length<8)gen();}
function gen(){const l=ledges[ledges.length-1],d=Math.min(1,(speed-260)/340);
 const gap=90+Math.random()*(70+80*d),w=160+Math.random()*(420-180*d),y=Math.max(250,Math.min(440,l.y+(Math.random()*2-1)*(50+40*d)));
 const nx=l.x+l.w+gap;ledges.push({x:nx,y,w});
 if(Math.random()<.7){for(let i=0;i<3;i++)beans.push({x:l.x+l.w+gap/2+(i-1)*28,y:Math.min(l.y,y)-70-Math.sin(i/2*Math.PI)*20,got:0});}}
reset();
loop((dt,t)=>{
 if(state==='title'||state==='dead'){
  if(state==='dead')deadT+=dt;
  if((hit('Space','Enter','ArrowUp','KeyW'))&&(state==='title'||deadT>.5)){reset();state='play';}
 }else if(state==='play'){
  speed=Math.min(620,speed+dt*9);const vx=speed;p.x+=vx*dt;dist+=vx*dt;
  if(hit('Space','ArrowUp','KeyW','KeyZ'))buffer=.12;buffer-=dt;coyote-=dt;
  const wasY=p.y;p.vy+=2100*dt;
  if(!down('Space','ArrowUp','KeyW','KeyZ')&&p.vy<-200)p.vy+=2600*dt; // variable height
  p.y+=p.vy*dt;p.ground=false;
  for(const l of ledges){if(p.x+8>l.x&&p.x-8<l.x+l.w){if(wasY<=l.y+1&&p.y>=l.y&&p.vy>=0){p.y=l.y;p.vy=0;p.ground=true;}
   else if(p.y>l.y+4&&wasY>l.y+4&&p.x+8<l.x+18){/* hit wall face */p.x=l.x-8;}}}
  if(p.ground)coyote=.1;
  if(buffer>0&&coyote>0){p.vy=-720;buffer=0;coyote=0;Audio_.blip(330,.15,'triangle',.08);}
  for(const b of beans)if(!b.got&&Math.hypot(b.x-p.x,b.y-(p.y-28))<26){b.got=1;score+=10;Audio_.blip(880,.1,'sine',.12);}
  if(p.y>H+80){state='dead';deadT=0;shake=.4;const s=Math.floor(dist/10)+score;if(s>best){best=s;localStorage.setItem('acRunnerBest',s);}Audio_.blip(110,.5,'sawtooth',.1);}
  while(ledges[ledges.length-1].x<camX+W*2)gen();
  ledges=ledges.filter(l=>l.x+l.w>camX-200);beans=beans.filter(b=>b.x>camX-200);
  camX+=(p.x-220-camX)*Math.min(1,dt*8);
 }
 cup.x+=(p.x-55-cup.x)*Math.min(1,dt*3);cup.y+=(p.y-62+Math.sin(t*2)*6-cup.y)*Math.min(1,dt*3);
 shake=Math.max(0,shake-dt);
 ctx.save();if(shake)ctx.translate((Math.random()-.5)*12*shake,(Math.random()-.5)*12*shake);
 drawBG(camX,t);
 for(const l of ledges)drawLedge(l.x-camX,l.y,l.w,H-l.y+10);
 for(const b of beans)if(!b.got){ctx.save();ctx.translate(b.x-camX,b.y+Math.sin(t*4+b.x)*3);ctx.rotate(.5);ctx.shadowColor=OR;ctx.shadowBlur=12;ctx.fillStyle=OR;ctx.beginPath();ctx.ellipse(0,0,6,8,0,0,7);ctx.fill();ctx.strokeStyle='#3a1500';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(0,-7);ctx.quadraticCurveTo(-3,0,0,7);ctx.stroke();ctx.restore();}
 drawSteam(dt,camX);drawCoffee(cup.x-camX,cup.y,t);
 if(state!=='title')drawAstronaut(p.x-camX,p.y,t,1,p.ground?speed/400:0,!p.ground);else drawAstronaut(220,380,t,1,0);
 vignette();ctx.restore();
 if(state==='play'){txt((Math.floor(dist/10))+' m',24,40,22,'#fff','left');txt('◆ '+score,24,68,18,OR,'left');txt('BEST '+best,W-24,40,16,'#888','right');}
 if(state==='title')title('COFFEE RUNNER','the cup keeps up. can you?',['SPACE / ↑ / tap: jump (hold for higher)','collect orange beans for bonus  ·  M: mute'],t);
 if(state==='dead'){ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);txt('LOST TO THE DARK',W/2,200,40);txt(Math.floor(dist/10)+' m  +  '+score+' bean pts',W/2,250,20,OR);txt('BEST '+best,W/2,285,16,'#999');txt(touchOn?'tap to run again':'SPACE to run again',W/2,360,18,'#fff','center',.5+.5*Math.sin(t*3));}
 
});

</script></body></html>
